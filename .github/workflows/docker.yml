name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker buildx build --load -t splat:test --cache-from type=gha .
          docker run -d --name splat -p 8080:8080 splat:test
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 2; done
          curl -fsS localhost:8080/api/status | tee status.json
          grep -q '"version"' status.json
          curl -fsS -X POST -H 'content-type: application/json' -d '{"name":"CI smoke"}' localhost:8080/api/projects
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/projects/ci-smoke/preview | tee preview.json | grep -q '"status":"ok"' && break; sleep 2; done
          grep -q '"status":"ok"' preview.json
          curl -fsS -o model.3mf "localhost:8080/api/projects/ci-smoke/export?format=3mf"
          curl -fsS -o model.step "localhost:8080/api/projects/ci-smoke/export?format=step"
          docker logs splat
